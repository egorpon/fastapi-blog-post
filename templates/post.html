{% extends "layout.html" %} {% block content %}

<article class="d-flex gap-4 py-3 px-4 mb-4 bg-body-tertiary rounded">
  <img
    class="rounded-circle article-img flex-shrink-0"
    src="{{ url_for('static', path='/profile_pics/default.jpg') }}"
    alt="{{ post.author }}'s profile picture"
    width="64"
    height="64"
    loading="lazy"
  />
  <div class="flex-grow-1">
    <div class="border-bottom pb-1">
      <a class="me-2 text-decoration-none" href="#">{{ post.author }}</a>
      <small class="text-body-secondary">{{ post.date_posted }}</small>
    </div>
    <h2>
      <a class="article-title text-decoration-none text-reset">
        {{ post.title | default("Title hasn't been set") }}
      </a>
    </h2>
    <p class="article-content">{{ post.content }}</p>
    <div class="post-actions mt-3 pt-3 border-top">
      <a class="btn btn-primary me-1" href="#">Edit Post</a>
      <button
        type="button"
        class="btn btn-danger"
        data-bs-toggle="modal"
        data-bs-target="#deleteModal"
      >
        Delete Post
      </button>
    </div>
  </div>
</article>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Delete Post?</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        >
          <span aria-hidden="true"></span>
        </button>
      </div>
      <div class="modal-body">
        <p>
          Are you sure you want to delete this post? The action cannot be
          undone.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger">Delete</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
      </div>
    </div>
  </div>
</div>

{% endblock content %}
