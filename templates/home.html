{% extends "layout.html"%} {% block content %} {% for post in posts %}
<article class="d-flex gap-4 py-3 px-4 mb-4 bg-body-tertiary rounded">
  <img
    class="rounded-circle article-img flex-shrink-0"
    src="{{ url_for('static', path='/profile_pics/default.jpg')}}"
    alt="{{ post.author }}'s profile picture"
    width="64"
    height="64"
    loading="lazy"
  />
  <div class="flex-grow-1">
    <div class="border-bottom pb-1">
      <a class="me-2 text-decoration-none" href="#">{{ post.author }}</a>
      <small class="text-body-secondary">{{ post.date_posted }}</small>
    </div>
    <h2>
      <a class="article-title text-reset text-decoration-none" href="#"
        >{{ post.title | default("Title hasn't been set")}}</a
      >
    </h2>
    <p class="article-content">{{ post.content }}</p>
  </div>
</article>
{% endfor %} {% endblock content %}
