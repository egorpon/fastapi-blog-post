<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Blog</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/lumen/bootstrap.min.css"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav
        class="navbar navbar-expand-md bg-primary fixed-top"
        data-bs-theme="dark"
      >
        <div class="container">
          <a class="navbar-brand me-4" href="{{ url_for('home') }}"
            >FastAPI Blog</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarColor01"
            aria-controls="navbarColor01"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarColor01">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('home') }}">Home </a>
              </li>
            </ul>
            <div class="navbar-nav">
              <a class="btn btn-outline-secondary mb-2 mb-md-0 me-md-2" href="#"
                >Login</a
              >
              <a class="btn btn-light mb-2 mb-md-0 me-md-3" href="#"
                >Register</a
              >
              <div class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  id="bd-theme"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <span id="bd-theme-text">🌗 Auto</span>
                </a>
                <ul
                  class="dropdown-menu dropdown-menu-end"
                  aria-labelledby="bd-theme"
                >
                  <li>
                    <button
                      class="dropdown-item"
                      type="button"
                      data-bs-theme-value="light"
                    >
                      🌝 Light
                    </button>
                  </li>
                  <li>
                    <button
                      class="dropdown-item"
                      type="button"
                      data-bs-theme-value="dark"
                    >
                      🌚 Dark
                    </button>
                  </li>
                  <li>
                    <button
                      class="dropdown-item"
                      type="button"
                      data-bs-theme-value="auto"
                    >
                      🌗 Auto
                    </button>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="container" style="padding-top: 6rem">
      <div class="row">
        <div class="col-md-8">{% block content %} {% endblock content %}</div>
        <aside class="col-md-4">
          <div
            class="content-section py-3 px-4 mb-4 mt-md-0 mt-3 bg-body-tertiary rounded"
          >
            <h3>Our Sidebar</h3>
            <p>You can put any information here you would like.</p>
            <ul class="list-group">
              <li
                class="list-group-item d-flex justify-content-between align-items-center"
              >
                Cras justo odio
              </li>
              <li
                class="list-group-item d-flex justify-content-between align-items-center"
              >
                Dapibus ac facilisis in
              </li>
              <li
                class="list-group-item d-flex justify-content-between align-items-center"
              >
                Morbi leo risus
              </li>
            </ul>
          </div>
        </aside>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const setTheme = (theme) => {
        if (theme === "auto") {
          document.documentElement.setAttribute(
            "data-bs-theme",
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light",
          );
        } else {
          document.documentElement.setAttribute("data-bs-theme", theme);
        }
        localStorage.setItem("theme", theme);

        // Update button text
        const themeText = {
          light: "🌝 Light",
          dark: "🌚 Dark",
          auto: "🌗 Auto",
        };
        document.getElementById("bd-theme-text").textContent = themeText[theme];
      };

      // Set theme on click
      document.querySelectorAll("[data-bs-theme-value]").forEach((button) => {
        button.addEventListener("click", () =>
          setTheme(button.getAttribute("data-bs-theme-value")),
        );
      });

      // Initialize
      setTheme(localStorage.getItem("theme") || "auto");
    </script>
  </body>
</html>
